<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../styles/globals.css" />
    <link rel="stylesheet" href="./statistics.module.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <main class="layout">
      <div class="top-bar">
        <div class="circle-container">
          <div class="circle red"></div>
          <div class="circle yellow"></div>
          <div class="circle green"></div>
        </div>
      </div>
      <h1 class="title" id="statistics-title"></h1>
      <p class="description hidden" id="statistics-description"></p>
      <button id="button-show-answer" class="answer-button" onclick="showHideAnswer()">정답 보기</button>
      <div class="button-container">
        <button id="button-prev" onclick="prevAnswer()">〈</button>
        <button id="button-next" onclick="nextAnswer()">〉</button>
      </div>

      <div class="chart-container">
        <canvas id="myChart" width="400" height="200"></canvas>
      </div>
    </main>
    <footer class="footer">
      <p>© 2025. GGABA All rights reserved.</p>
    </footer>
  </body>
</html>
